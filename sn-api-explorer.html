<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServiceNow API Explorer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128; --border: #30363d;
    --text: #c9d1d9; --text2: #8b949e; --text3: #6e7681;
    --accent: #58a6ff; --green: #3fb950; --red: #f85149;
    --orange: #d29922; --purple: #bc8cff; --cyan: #39d353;
    --method-get: #3fb950; --method-post: #58a6ff; --method-put: #d29922;
    --method-patch: #bc8cff; --method-delete: #f85149;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  .header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .header h1 span { color: var(--accent); }
  .search-box { flex: 1; max-width: 600px; position: relative; }
  .search-box input { width: 100%; padding: 8px 12px 8px 36px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s; }
  .search-box input:focus { border-color: var(--accent); }
  .search-box .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
  .stats { color: var(--text2); font-size: 12px; white-space: nowrap; }
  .stats b { color: var(--text); }

  /* Filters */
  .filters { display: flex; align-items: center; gap: 8px; padding: 8px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  .filter-label { color: var(--text3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .method-filters { display: flex; gap: 4px; }
  .method-btn { padding: 3px 10px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; }
  .method-btn:hover { border-color: var(--text3); }
  .method-btn.active { color: #fff; }
  .method-btn.active[data-method="GET"] { background: var(--method-get); border-color: var(--method-get); }
  .method-btn.active[data-method="POST"] { background: var(--method-post); border-color: var(--method-post); }
  .method-btn.active[data-method="PUT"] { background: var(--method-put); border-color: var(--method-put); }
  .method-btn.active[data-method="PATCH"] { background: var(--method-patch); border-color: var(--method-patch); }
  .method-btn.active[data-method="DELETE"] { background: var(--method-delete); border-color: var(--method-delete); }
  .ns-select { padding: 4px 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; outline: none; max-width: 200px; }
  .ns-select:focus { border-color: var(--accent); }
  .clear-btn { padding: 3px 10px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 11px; cursor: pointer; }
  .clear-btn:hover { border-color: var(--red); color: var(--red); }

  /* Main layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar - namespace list */
  .sidebar { width: 240px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg2); }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .ns-item { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; transition: background 0.1s; }
  .ns-item:hover { background: var(--bg3); }
  .ns-item.active { background: var(--bg3); border-left: 3px solid var(--accent); padding-left: 11px; }
  .ns-item .name { font-size: 13px; font-weight: 500; font-family: 'SF Mono', 'Cascadia Code', monospace; }
  .ns-item .count { font-size: 11px; color: var(--text3); background: var(--bg); padding: 1px 7px; border-radius: 10px; }
  .ns-item.hidden { display: none; }

  /* Content area */
  .content { flex: 1; overflow-y: auto; padding: 0; }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* API cards */
  .api-card { border-bottom: 1px solid var(--border); }
  .api-card.hidden { display: none; }
  .api-header { padding: 14px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.1s; }
  .api-header:hover { background: var(--bg2); }
  .api-header .chevron { color: var(--text3); transition: transform 0.2s; font-size: 11px; flex-shrink: 0; }
  .api-card.expanded .api-header .chevron { transform: rotate(90deg); }
  .api-title { font-size: 14px; font-weight: 600; }
  .api-ns-badge { font-size: 11px; font-family: 'SF Mono', 'Cascadia Code', monospace; color: var(--accent); background: rgba(88,166,255,0.1); padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }
  .api-desc { font-size: 12px; color: var(--text2); margin-left: auto; max-width: 400px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; flex-shrink: 1; }
  .api-endpoint-count { font-size: 11px; color: var(--text3); flex-shrink: 0; }
  .api-body { display: none; padding: 0 20px 16px; }
  .api-card.expanded .api-body { display: block; }
  .api-docs-link { font-size: 12px; color: var(--accent); text-decoration: none; margin-bottom: 12px; display: inline-block; }
  .api-docs-link:hover { text-decoration: underline; }

  /* Endpoint rows */
  .endpoint { margin-bottom: 2px; border-radius: 6px; background: var(--bg2); border: 1px solid var(--border); overflow: hidden; }
  .endpoint-header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; }
  .endpoint-header:hover { background: var(--bg3); }
  .method-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; font-family: 'SF Mono', 'Cascadia Code', monospace; min-width: 56px; text-align: center; }
  .method-badge.GET { background: rgba(63,185,80,0.15); color: var(--method-get); }
  .method-badge.POST { background: rgba(88,166,255,0.15); color: var(--method-post); }
  .method-badge.PUT { background: rgba(210,153,34,0.15); color: var(--method-put); }
  .method-badge.PATCH { background: rgba(188,140,255,0.15); color: var(--method-patch); }
  .method-badge.DELETE { background: rgba(248,81,73,0.15); color: var(--method-delete); }
  .endpoint-path { font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 13px; color: var(--text); }
  .endpoint-path .param { color: var(--orange); }
  .endpoint-desc { font-size: 12px; color: var(--text2); margin-left: auto; max-width: 350px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .endpoint-detail { display: none; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--bg); }
  .endpoint.expanded .endpoint-detail { display: block; }
  .endpoint .chevron { color: var(--text3); font-size: 10px; transition: transform 0.2s; }
  .endpoint.expanded .chevron { transform: rotate(90deg); }

  /* Params table */
  .params-table { width: 100%; font-size: 12px; border-collapse: collapse; }
  .params-table th { text-align: left; color: var(--text3); font-weight: 500; padding: 4px 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
  .params-table td { padding: 5px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .params-table .param-name { font-family: 'SF Mono', 'Cascadia Code', monospace; color: var(--cyan); }
  .params-table .param-in { color: var(--text3); font-size: 11px; }
  .params-table .required { color: var(--red); font-size: 10px; font-weight: 600; }

  /* Prompt area */
  .prompt-area { border-top: 1px solid var(--border); background: var(--bg2); padding: 12px 20px; flex-shrink: 0; }
  .prompt-bar { display: flex; align-items: center; gap: 12px; }
  .prompt-bar label { color: var(--text3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .prompt-text { flex: 1; font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 12px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; max-height: 60px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .copy-btn { padding: 6px 16px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
  .copy-btn:hover { opacity: 0.85; }
  .copy-btn.copied { background: var(--green); }

  /* Highlight */
  mark { background: rgba(210,153,34,0.3); color: var(--text); border-radius: 2px; padding: 0 1px; }

  /* No results */
  .no-results { padding: 60px 20px; text-align: center; color: var(--text3); }
  .no-results .big { font-size: 48px; margin-bottom: 12px; }
  .no-results p { font-size: 14px; }

  /* Scrollbar for sidebar */
  .sidebar::-webkit-scrollbar-track, .content::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="header">
  <h1><span>SN</span> API Explorer</h1>
  <div class="search-box">
    <span class="icon">&#128269;</span>
    <input type="text" id="search" placeholder="Search namespaces, APIs, endpoints, parameters..." autofocus />
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="filters">
  <span class="filter-label">Methods</span>
  <div class="method-filters" id="methodFilters">
    <button class="method-btn active" data-method="GET">GET</button>
    <button class="method-btn active" data-method="POST">POST</button>
    <button class="method-btn active" data-method="PUT">PUT</button>
    <button class="method-btn active" data-method="PATCH">PATCH</button>
    <button class="method-btn active" data-method="DELETE">DELETE</button>
  </div>
  <span class="filter-label" style="margin-left:12px">Namespace</span>
  <select class="ns-select" id="nsFilter"><option value="">All namespaces</option></select>
  <button class="clear-btn" id="clearAll">Clear filters</button>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

<div class="prompt-area">
  <div class="prompt-bar">
    <label>Prompt</label>
    <div class="prompt-text" id="prompt">Select an API or endpoint to generate a prompt...</div>
    <button class="copy-btn" id="copyBtn">Copy</button>
  </div>
</div>

// State
const state = {
  search: '',
  methods: new Set(['GET','POST','PUT','PATCH','DELETE']),
  namespace: '',
  selectedApi: null,
  selectedEndpoint: null,
};

// Namespace grouping
function getNamespaces() {
  const map = {};
  API_DATA.forEach(api => {
    if (!map[api.ns]) map[api.ns] = [];
    map[api.ns].push(api);
  });
  return Object.entries(map).sort((a,b) => a[0].localeCompare(b[0]));
}

const namespaces = getNamespaces();

// Populate namespace filter dropdown
const nsFilter = document.getElementById('nsFilter');
namespaces.forEach(([ns]) => {
  const opt = document.createElement('option');
  opt.value = ns;
  opt.textContent = ns;
  nsFilter.appendChild(opt);
});

// Search matching
function matches(text, query) {
  if (!query) return true;
  return text.toLowerCase().includes(query.toLowerCase());
}

function highlight(text, query) {
  if (!query || !text) return text;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
}

function apiMatches(api, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  if (api.ns.toLowerCase().includes(q)) return true;
  if (api.apiName.toLowerCase().includes(q)) return true;
  if (api.desc.toLowerCase().includes(q)) return true;
  for (const ep of api.endpoints) {
    if (ep.path.toLowerCase().includes(q)) return true;
    if (ep.desc.toLowerCase().includes(q)) return true;
    if (ep.method.toLowerCase().includes(q)) return true;
    for (const p of ep.params) {
      if (p.name.toLowerCase().includes(q)) return true;
      if (p.desc.toLowerCase().includes(q)) return true;
    }
  }
  return false;
}

function endpointMatches(ep) {
  return state.methods.has(ep.method);
}

function formatPath(pathStr, query) {
  let html = highlight(pathStr, query);
  html = html.replace(/\{([^}]+)\}/g, '<span class="param">{$1}</span>');
  return html;
}

// Render
function render() {
  const q = state.search;
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('content');

  // Sidebar
  let sidebarHtml = '';
  let visibleApis = 0;
  let visibleEndpoints = 0;

  namespaces.forEach(([ns, apis]) => {
    if (state.namespace && state.namespace !== ns) return;
    const matchingApis = apis.filter(a => apiMatches(a, q));
    const epCount = matchingApis.reduce((s, a) => s + a.endpoints.filter(e => endpointMatches(e)).length, 0);
    if (matchingApis.length === 0) return;
    visibleApis += matchingApis.length;
    visibleEndpoints += epCount;
    sidebarHtml += '<div class="ns-item' + (state.namespace === ns ? ' active' : '') + '" data-ns="' + ns + '">'
      + '<span class="name">' + highlight(ns, q) + '</span>'
      + '<span class="count">' + matchingApis.length + '</span></div>';
  });
  sidebar.innerHTML = sidebarHtml;

  // Content
  let contentHtml = '';
  let filteredApis = API_DATA.filter(a => {
    if (state.namespace && a.ns !== state.namespace) return false;
    return apiMatches(a, q);
  });

  if (filteredApis.length === 0) {
    contentHtml = '<div class="no-results"><div class="big">&#8709;</div><p>No APIs match your search</p></div>';
  } else {
    filteredApis.forEach(api => {
      const eps = api.endpoints.filter(e => endpointMatches(e));
      const isExpanded = state.selectedApi === api.file;
      contentHtml += '<div class="api-card' + (isExpanded ? ' expanded' : '') + '" data-file="' + api.file + '">';
      contentHtml += '<div class="api-header" data-file="' + api.file + '">';
      contentHtml += '<span class="chevron">&#9654;</span>';
      contentHtml += '<span class="api-ns-badge">' + api.ns + '</span>';
      contentHtml += '<span class="api-title">' + highlight(api.apiName, q) + '</span>';
      if (api.desc) contentHtml += '<span class="api-desc">' + highlight(api.desc, q) + '</span>';
      contentHtml += '<span class="api-endpoint-count">' + eps.length + ' endpoint' + (eps.length !== 1 ? 's' : '') + '</span>';
      contentHtml += '</div>';

      if (isExpanded) {
        contentHtml += '<div class="api-body">';
        if (api.docsUrl) contentHtml += '<a class="api-docs-link" href="' + api.docsUrl + '" target="_blank">&#128214; Documentation</a>';
        eps.forEach((ep, i) => {
          const epKey = api.file + ':' + i;
          const epExpanded = state.selectedEndpoint === epKey;
          contentHtml += '<div class="endpoint' + (epExpanded ? ' expanded' : '') + '" data-ep="' + epKey + '">';
          contentHtml += '<div class="endpoint-header" data-ep="' + epKey + '">';
          contentHtml += '<span class="chevron">&#9654;</span>';
          contentHtml += '<span class="method-badge ' + ep.method + '">' + ep.method + '</span>';
          contentHtml += '<span class="endpoint-path">' + formatPath(ep.path, q) + '</span>';
          if (ep.desc) contentHtml += '<span class="endpoint-desc">' + highlight(ep.desc, q) + '</span>';
          contentHtml += '</div>';

          if (epExpanded && ep.params.length > 0) {
            contentHtml += '<div class="endpoint-detail">';
            contentHtml += '<table class="params-table"><thead><tr><th>Parameter</th><th>In</th><th>Required</th><th>Description</th></tr></thead><tbody>';
            ep.params.forEach(p => {
              contentHtml += '<tr>';
              contentHtml += '<td class="param-name">' + highlight(p.name, q) + '</td>';
              contentHtml += '<td class="param-in">' + p.in + '</td>';
              contentHtml += '<td>' + (p.req ? '<span class="required">required</span>' : '') + '</td>';
              contentHtml += '<td>' + highlight(p.desc, q) + '</td>';
              contentHtml += '</tr>';
            });
            contentHtml += '</tbody></table></div>';
          } else if (epExpanded) {
            contentHtml += '<div class="endpoint-detail"><span style="color:var(--text3)">No parameters</span></div>';
          }
          contentHtml += '</div>';
        });
        contentHtml += '</div>';
      }
      contentHtml += '</div>';
    });
  }
  content.innerHTML = contentHtml;

  // Stats
  document.getElementById('stats').innerHTML = '<b>' + visibleApis + '</b> APIs &middot; <b>' + visibleEndpoints + '</b> endpoints';

  // Update prompt
  updatePrompt();
}

function updatePrompt() {
  const prompt = document.getElementById('prompt');
  const parts = [];

  if (state.search) {
    parts.push('searching for "' + state.search + '"');
  }
  if (state.namespace) {
    parts.push('in namespace ' + state.namespace);
  }
  const activeMethods = Array.from(state.methods);
  if (activeMethods.length < 5 && activeMethods.length > 0) {
    parts.push('filtering by ' + activeMethods.join(', ') + ' methods');
  }

  if (state.selectedApi) {
    const api = API_DATA.find(a => a.file === state.selectedApi);
    if (api) {
      const epCount = api.endpoints.filter(e => endpointMatches(e)).length;
      let text = 'Use the ServiceNow "' + api.apiName + '" API (namespace: ' + api.ns + ')';
      if (api.desc) text += ' which ' + api.desc.toLowerCase();
      text += '. It has ' + epCount + ' endpoint(s):';
      const epList = api.endpoints.filter(e => endpointMatches(e)).map(e =>
        '\n  ' + e.method + ' ' + e.path + (e.desc ? ' - ' + e.desc : '')
      ).join('');
      prompt.textContent = text + epList;
      return;
    }
  }

  if (parts.length === 0) {
    prompt.textContent = 'Select an API or endpoint to generate a prompt...';
  } else {
    const filteredApis = API_DATA.filter(a => {
      if (state.namespace && a.ns !== state.namespace) return false;
      return apiMatches(a, state.search);
    });
    prompt.textContent = 'ServiceNow REST APIs ' + parts.join(', ') + '. Found ' + filteredApis.length + ' matching APIs.';
  }
}

// Events
document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value;
  state.selectedApi = null;
  state.selectedEndpoint = null;
  render();
});

document.getElementById('methodFilters').addEventListener('click', e => {
  const btn = e.target.closest('.method-btn');
  if (!btn) return;
  const m = btn.dataset.method;
  btn.classList.toggle('active');
  if (state.methods.has(m)) state.methods.delete(m);
  else state.methods.add(m);
  render();
});

document.getElementById('nsFilter').addEventListener('change', e => {
  state.namespace = e.target.value;
  state.selectedApi = null;
  state.selectedEndpoint = null;
  render();
});

document.getElementById('sidebar').addEventListener('click', e => {
  const item = e.target.closest('.ns-item');
  if (!item) return;
  const ns = item.dataset.ns;
  state.namespace = state.namespace === ns ? '' : ns;
  document.getElementById('nsFilter').value = state.namespace;
  state.selectedApi = null;
  state.selectedEndpoint = null;
  render();
});

document.getElementById('content').addEventListener('click', e => {
  const apiHeader = e.target.closest('.api-header');
  if (apiHeader) {
    const file = apiHeader.dataset.file;
    state.selectedApi = state.selectedApi === file ? null : file;
    state.selectedEndpoint = null;
    render();
    return;
  }
  const epHeader = e.target.closest('.endpoint-header');
  if (epHeader) {
    const ep = epHeader.dataset.ep;
    state.selectedEndpoint = state.selectedEndpoint === ep ? null : ep;
    render();
    return;
  }
});

document.getElementById('clearAll').addEventListener('click', () => {
  state.search = '';
  state.namespace = '';
  state.methods = new Set(['GET','POST','PUT','PATCH','DELETE']);
  state.selectedApi = null;
  state.selectedEndpoint = null;
  document.getElementById('search').value = '';
  document.getElementById('nsFilter').value = '';
  document.querySelectorAll('.method-btn').forEach(b => b.classList.add('active'));
  render();
});

document.getElementById('copyBtn').addEventListener('click', function() {
  const text = document.getElementById('prompt').textContent;
  navigator.clipboard.writeText(text);
  this.textContent = 'Copied!';
  this.classList.add('copied');
  setTimeout(() => { this.textContent = 'Copy'; this.classList.remove('copied'); }, 1500);
});

// Keyboard shortcut: Escape clears search
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    state.search = '';
    document.getElementById('search').value = '';
    document.getElementById('search').focus();
    render();
  }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// Initial render
render();
</script>
